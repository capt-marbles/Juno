[project]
name = "juno"
version = "0.1.0"
description = "Terminal control panel for agent work"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "A Walker" }]
license = { text = "MIT" }

[project.scripts]
juno = "juno.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
